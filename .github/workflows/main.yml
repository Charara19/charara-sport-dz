name: Build Charara Sport DZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Restore Firebase configuration
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON"
          printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          node -e "JSON.parse(require('fs').readFileSync('google-services.json','utf8'))"

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Configure permanent release signing
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: charara-sport
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_PASSWORD"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/charara-sport-release.keystore
          chmod 600 app/charara-sport-release.keystore
          keytool -list -keystore app/charara-sport-release.keystore -alias "$ANDROID_KEY_ALIAS" -storepass:env ANDROID_KEYSTORE_PASSWORD > /dev/null
          echo "تم التحقق من ملف مفتاح التوقيع"

          node <<'NODE'
          const fs = require('fs');
          const path = 'app/build.gradle';
          let gradle = fs.readFileSync(path, 'utf8');

          if (!gradle.includes('signingConfigs {')) {
            throw new Error('لم يتم العثور على signingConfigs في build.gradle');
          }

          if (gradle.includes('charara-sport-release.keystore')) {
            throw new Error('إعداد التوقيع موجود مسبقاً؛ أوقفنا التعديل لتجنب التكرار');
          }

          gradle = gradle.replace(
            'signingConfigs {',
            `signingConfigs {
              release {
                storeFile file("charara-sport-release.keystore")
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }`
          );

          const buildTypesStart = gradle.indexOf('buildTypes {');
          if (buildTypesStart < 0) {
            throw new Error('لم يتم العثور على buildTypes');
          }

          const before = gradle.slice(0, buildTypesStart);
          const after = gradle.slice(buildTypesStart);
          const updated = after.replace(
            /(release\s*\{[\s\S]*?signingConfig\s+)signingConfigs\.debug/,
            '$1signingConfigs.release'
          );

          if (updated === after) {
            throw new Error('تعذر ضبط توقيع Release؛ لم يتغير الملف');
          }

          fs.writeFileSync(path, before + updated);
          console.log('تم إعداد توقيع Release بالمفتاح الدائم');
          NODE

      - name: Build Release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: charara-sport
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: charara-sport-dz-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14

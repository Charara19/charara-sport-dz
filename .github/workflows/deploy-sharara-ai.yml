name: Deploy Sharara AI Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy Sharara AI to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -f sharara-ai-brain/index.js

          RESPONSE_FILE=$(mktemp)
          trap 'rm -f "$RESPONSE_FILE"' EXIT

          curl --fail-with-body --silent --show-error \
            -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/sharara-ai-brain" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -F 'metadata={"main_module":"index.js","compatibility_date":"2026-11-15","bindings":[{"type":"ai","name":"AI"}]};type=application/json' \
            -F 'index.js=@sharara-ai-brain/index.js;type=application/javascript+module' \
            -o "$RESPONSE_FILE"

          jq -e '.success == true' "$RESPONSE_FILE" >/dev/null
          echo "Sharara AI Worker deployed successfully."
          jq -r '"Worker: " + .result.id' "$RESPONSE_FILE"
